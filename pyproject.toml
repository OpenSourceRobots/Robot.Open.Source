[project]
name = "robotkit"
version = "0.2.0"
description = "Open source toolkit for building and simulating large heavy-duty robots"
requires-python = ">=3.9"
license = { text = "MIT" }
readme = "README.md"

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[project.scripts]
robotkit = "robotkit.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["robotkit"]
